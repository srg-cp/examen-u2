<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Confirma tu cuenta de Entre Huellas</title></head>
<body style="margin:0;padding:32px;background:#F6F7F4;color:#17231C;font-family:Arial,sans-serif">
  <main style="max-width:480px;margin:auto;background:white;border-radius:24px;padding:32px">
    <h1>Revisa tu correo</h1>
    <p>Introduce este código de seis dígitos en Entre Huellas para confirmar tu cuenta.</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
    <p>Puedes leer este correo en cualquier dispositivo e introducir el código en la app.</p>
    <p>Si el código venció, solicita otro desde la app. Si no creaste una cuenta, ignora este correo.</p>
  </main>
</body>
</html>
