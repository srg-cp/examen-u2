name: Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter.yml'
      - '.github/workflows/ios-sideload.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --dart-define=AMBIENT_BACKGROUND_MOTION=false

  android:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Avoid the project's 8 GB development heap on hosted runners.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set temporary signing path
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/entrehuellas-release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Prepare private build files
        env:
          MOBILE_CONFIG_JSON: ${{ secrets.MOBILE_CONFIG_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_android_release.py
      - run: flutter pub get --enforce-lockfile
      - name: Build signed APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/release.local.json
          --build-number=$((10000 + GITHUB_RUN_NUMBER))
      - name: Verify signature and prepare download
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/distribution
          cp build/app/outputs/flutter-apk/app-release.apk build/distribution/entre-huellas-android.apk
          cd build/distribution
          sha256sum entre-huellas-android.apk > SHA256SUMS.txt
      - name: Keep APK available if release publication fails
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/mobile/build/distribution/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private build files
        if: always()
        shell: bash
        run: rm -f config/release.local.json "$ANDROID_KEYSTORE_PATH"

  ios:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    uses: ./.github/workflows/ios-sideload.yml
    secrets:
      MOBILE_CONFIG_JSON: ${{ secrets.MOBILE_CONFIG_JSON }}

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Android package from this run
        uses: actions/download-artifact@v4
        with:
          name: android-${{ github.run_number }}-${{ github.run_attempt }}
          path: distribution/android
      - name: Download iOS package from this run
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: distribution/ios
      - name: Verify and assemble shared release
        shell: bash
        run: |
          set -euo pipefail
          (cd distribution/android && sha256sum -c SHA256SUMS.txt)
          (cd distribution/ios && sha256sum -c SHA256SUMS.txt)
          grep -Fx "source_commit=$GITHUB_SHA" distribution/ios/BUILD.txt
          mkdir release
          cp distribution/android/entre-huellas-android.apk release/
          cp distribution/ios/entre-huellas-ios-unsigned.ipa release/
          cp distribution/ios/Podfile.lock release/ios-Podfile.lock
          cp distribution/ios/BUILD.txt release/BUILD.txt
          (cd release && sha256sum *.apk *.ipa > SHA256SUMS.txt)
      - name: Publish Android and iOS prerelease together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            test "$target" = "$GITHUB_SHA"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Entre Huellas build ${GITHUB_RUN_NUMBER} - Android + iOS" \
              --notes "APK Android firmado e IPA iOS para firmar con Sideloadly. Ambos proceden del commit $GITHUB_SHA. Consulta INSTALACION_IOS.md en ese commit para instalar y renovar."
          fi
