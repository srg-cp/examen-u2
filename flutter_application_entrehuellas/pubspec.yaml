name: flutter_application_entrehuellas
description: "Entre Huellas: recuperación colaborativa de mascotas."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/google_g.png
    - assets/onboarding/dog_waving.png
    - assets/onboarding/dog_with_map.png
    - assets/onboarding/dog_and_cat.png
    - assets/illustrations/community_pets.png
